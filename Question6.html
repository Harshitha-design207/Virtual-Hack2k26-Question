<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualHack2K26 - Debugging Question</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
        }

        .header h2 {
            color: #667eea;
            margin-top: 10px;
        }

        .question-box {
            background: #f8f9fa;
            border-left: 6px solid #667eea;
            padding: 20px;
            border-radius: 12px;
        }

        .question-box h3 {
            margin-bottom: 15px;
            color: #444;
        }

        pre {
            background: #1e1e1e;
            color: #00ff99;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 16px;
            line-height: 1.6;
        }

        .submit-section {
            margin-top: 25px;
            text-align: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }


        /* Mobile Responsive */

        @media(max-width:600px){

            .container{
                padding:20px;
            }

            .header h1{
                font-size:24px;
            }

            .header h2{
                font-size:18px;
            }

            pre{
                font-size:13px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">
        <h1>🐞 Debugging Question</h1>
        <h2>VirtualHack2K26</h2>
    </div>


    <div class="question-box">

        <h3>Find the Error and Correct the Code:</h3>

        <p> 
            class Test:
    value = 10

a = Test()
b = Test()

a.value = 20

print(Test.value, b.value, a.value)
        </p>

    </div>
<p> GO Back to Website and Submit your answer  <button> <a href="https://virtual-hackathon-2k26.vercel.app/dashboard ">Go back  to site  </a></button> </p>
</div>


</body>
</html>
